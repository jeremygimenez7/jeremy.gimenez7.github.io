<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img"
     aria-label="Lab architecture: Windows Endpoint with Wazuh Agent sends events to a Wazuh Manager on an Ubuntu Server virtual machine inside Oracle VirtualBox; the Wazuh Dashboard feeds security alert analysis and an AI-assisted SOC workflow.">
  <style>
    .box   { fill: #141c27; stroke: #22303f; stroke-width: 1.5; }
    .lbl   { fill: #e6edf3; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .sub   { fill: #9aa8bb; font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; }
    .title { fill: #e6edf3; font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; }
    .flow  { stroke: #38bdf8; stroke-width: 2; fill: none; }
    .vm    { fill: none; stroke: #38bdf8; stroke-width: 1.6; stroke-dasharray: 7 6; opacity: 0.75; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="24" y="36" class="title">Wazuh SIEM Home Lab — Event Flow</text>

  <!-- Oracle VirtualBox boundary -->
  <rect x="376" y="112" width="436" height="128" rx="14" class="vm"/>
  <text x="594" y="228" text-anchor="middle" class="sub">Oracle VirtualBox — virtualised environment</text>

  <!-- Node 1: Windows Endpoint -->
  <rect x="16" y="136" width="150" height="72" rx="10" class="box"/>
  <text x="91" y="167" text-anchor="middle" class="lbl">Windows</text>
  <text x="91" y="185" text-anchor="middle" class="lbl">Endpoint</text>

  <!-- Node 2: Wazuh Agent -->
  <rect x="196" y="136" width="150" height="72" rx="10" class="box"/>
  <text x="271" y="177" text-anchor="middle" class="lbl">Wazuh Agent</text>

  <!-- Node 3: Wazuh Manager -->
  <rect x="400" y="136" width="180" height="72" rx="10" class="box"/>
  <text x="490" y="167" text-anchor="middle" class="lbl">Wazuh Manager</text>
  <text x="490" y="185" text-anchor="middle" class="sub">Ubuntu Server VM</text>

  <!-- Node 4: Wazuh Dashboard -->
  <rect x="608" y="136" width="180" height="72" rx="10" class="box"/>
  <text x="698" y="167" text-anchor="middle" class="lbl">Wazuh</text>
  <text x="698" y="185" text-anchor="middle" class="lbl">Dashboard</text>

  <!-- Node 5: Analysis / AI-assisted SOC -->
  <rect x="840" y="136" width="148" height="72" rx="10" class="box"/>
  <text x="914" y="167" text-anchor="middle" class="lbl">Security Alert</text>
  <text x="914" y="185" text-anchor="middle" class="sub">Analysis / AI-SOC</text>

  <!-- Arrows -->
  <line x1="168" y1="172" x2="192" y2="172" class="flow" marker-end="url(#arrow)"/>
  <line x1="348" y1="172" x2="396" y2="172" class="flow" marker-end="url(#arrow)"/>
  <line x1="582" y1="172" x2="604" y2="172" class="flow" marker-end="url(#arrow)"/>
  <line x1="790" y1="172" x2="836" y2="172" class="flow" marker-end="url(#arrow)"/>

  <!-- Step captions -->
  <text x="91"  y="264" text-anchor="middle" class="sub">monitored host</text>
  <text x="271" y="264" text-anchor="middle" class="sub">collects events</text>
  <text x="698" y="264" text-anchor="middle" class="sub">alerts reviewed</text>
  <text x="914" y="264" text-anchor="middle" class="sub">investigation</text>
</svg>
